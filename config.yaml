# CXI Update Skill Configuration
# Supports multiple audience profiles from the same core data sources

# Basic Team Info
team: CXI
timezone: America/Los_Angeles

# Profiles - each profile targets a different audience with the same core data
profiles:
  exec_biweekly:
    name: "Biweekly Executive Summary"
    schedule: biweekly
    audience: "VP Support, COO, SVP Eng"
    template_id: "1_Wqcl7rmWHME4vGkKiCLs-3BXIdYE7gH7wbxuzW27ys"
    markdown_template: "assets/templates/biweekly-template.md"
    style_section: "Executive Summary Writing Style Guidance"
    title_format: "CXI Executive Summary - {date}"
    slack_notification_channel: "#support-automation"
    reviewers:
      primary: kevin.baron@databricks.com
      secondary: samira.emmerson@databricks.com
      cc:
        - nilesh.bhide@databricks.com
        - manoj@databricks.com

  weekly_support:
    name: "Weekly TSE Update (CXI Team Updates email)"
    schedule: weekly          # Day 10 Friday, run AFTER the Sprint Review
    day: Friday
    audience: "All Support Engineering (TSEs, Tech Leads, Shift Leads, TSE Managers, Directors; plus IM/EM and Field Eng)"
    output_format: email      # final medium = formatted-HTML Gmail draft; but RENDER INLINE in the CLI first to iterate; create the draft only after Kevin approves; never auto-send
    # PRIMARY SOURCE (most important): Gemini Notes TRANSCRIPTS (not summaries) of this sprint's ceremonies -
    # CXI Sprint Review (Day 10), the 4 CXI Standups (Wed/Fri/Tue/Thu), and CXI Sprint Planning (Day 1 Mon).
    # SPINE of "What We Shipped": every issue Done in the active sprint
    #   (project = PLAT AND component = 'Support Platform' AND status = Done AND sprint IN openSprints()), paged fully.
    primary_sources: ["CXI Sprint Review transcript", "4 CXI Standup transcripts", "CXI Sprint Planning transcript", "active-sprint Done list"]
    email:
      subject: "CXI Team Updates"
      to:
        - support-internal@databricks.com
      cc:                                      # resolved via Glean 2026-05-29
        - hatim@databricks.com                  # Hatim Shafique
        - vinod.marur@databricks.com            # Vinod Marur
        - sam.shah@databricks.com               # Sam Shah
        - sayan.sanyal@databricks.com           # Sayan Sanyal
        - olarn.p@databricks.com                # Olarn Pornpitaksuk
        - devyn.fisher@databricks.com           # Devyn Fisher
        - farhad.pagdiwalla@databricks.com      # Farhad Pagdiwalla
        - nilesh.bhide@databricks.com           # Nilesh Bhide
        - ravi.gangumalla@databricks.com        # Ravi Gangumalla
        - jacob.plachta@databricks.com          # Jacob Plachta
        - huy.nguyen@databricks.com             # Huy Nguyen
        - ted.tomlinson@databricks.com          # Ted Tomlinson
        - akhil.aggrawal@databricks.com         # Akhil Aggrawal
        - nandini.r@databricks.com              # Nandini N
        - nidhin.vn@databricks.com              # Nidhin V N
    markdown_template: "assets/templates/tse-update-email-template.md"
    style_section: "Weekly Support Update Writing Style Guidance"
    title_format: "CXI Team Updates"
    slack_notification_channel: "#eng-support-automation"   # companion tease (single * bold, no LLM footer); exclude Merlin per channel norm
    reviewers:
      primary: kevin.baron@databricks.com

# Data Sources Configuration
data_sources:
  # Google Calendar Configuration
  meetings:
    calendar_id: "kevin.baron@databricks.com"  # Using your primary Google Calendar
    # Meeting keywords to search for
    keywords:
      - "CXI Stand up"
      - "CXI Sprint Planning"
      - "CXI Sprint Review"
      - CXI
    days_back: 14  # How many days to look back for meetings

  # Gmail - Gemini Meeting Summaries
  gmail:
    # Gemini auto-generates meeting summary emails after CXI calls
    # These often land in Trash, so we use in:anywhere to search all folders
    query: "in:anywhere from:me subject:(notes of CXI) newer_than:14d"
    max_results: 20
    days_back: 14  # Match the biweekly cycle

  # JIRA Configuration
  jira:
    project_key: PLAT  # CXI project
    # JQL query for UC tickets
    custom_jql: "project = PLAT AND component = 'Support Platform' AND (status = 'In Progress' OR updated >= -14d) ORDER BY priority DESC"
    # Optional: Specific statuses to highlight
    highlight_statuses:
      - "To Do"
      - "In Progress"
      - "In Review"
      - "Done"
    # Optional: Priority levels to track
    track_priorities:
      - "Highest"
      - "High"
      - "Medium"

    # Roadmap-to-JIRA Mapping (Q2 - 14 objectives -> 13 workstream Epics)
    # Updated 2026-05-30 for the Q2 CXI Structure: one Epic per workstream,
    # assigned to the first DRI listed in the "Q2 CXI Structure and Committed Work" doc tab.
    # Each Q2 roadmap objective maps to one or more workstream Epics; objectives 1 and 4
    # span multiple workstreams, so all relevant Epics are listed.
    # Objective 13 (Sherpa APIs) is tracked in SUPPORTDS, not on the PLAT board.
    # When building the exec biweekly, group JIRA tickets by their workstream Epic,
    # then frame progress in terms of the corresponding roadmap objective.
    #
    # 👉 UPDATE this mapping when the Q2 roadmap or the workstream Epics change.
    roadmap_to_epic_mapping:
      # P0-A: Prove the Path to Automation
      "1. Automated Investigation and Resolution Readiness in Support Agent":
        - "PLAT-162746"   # Remote Data Access
        - "PLAT-161917"   # Remote Support Agent
        - "PLAT-160152"   # Skills Quality post-merge + eval + SA perf/adoption
      "2. Support Agent Adoption / Default Debug Surface":
        - "PLAT-160153"   # Support Agent Workflows
        - "PLAT-160152"   # Skills Quality post-merge + eval + SA perf/adoption
      "3. CXI MCP Tool Expansion":
        - "PLAT-156366"   # Support Agent MCP Server
      "4. Quality Layer for Automation Readiness":
        - "PLAT-160151"   # Skills Quality & Creation, pre-merge
        - "PLAT-162745"   # Infra-level checks, pre-merge
        - "PLAT-160152"   # Skills Quality post-merge + eval + SA perf/adoption
      # P0-B: Merlin as Intake, Diagnostics, Taxonomy, Deflection
      "5. Merlin v2 GA / Retire v1": ["PLAT-119961"]                          # Merlin
      "6. Merlin Backend Data Sources and Customer-Facing Taxonomy": ["PLAT-119961"]
      "7. Additional Merlin Diagnostics Collection": ["PLAT-119961"]
      "8. Launch Merlin for Azure": ["PLAT-119961"]
      # P1: Extend Support Agent into Enablement and Operations
      "9. Support Agent Learn / L&E Mode": ["PLAT-162744"]                    # Support Agent Learn Mode
      "10. Support Agent Workflow Mode": ["PLAT-160153"]                      # Support Agent Workflows
      "11. Support Operations Command Center v1": ["PLAT-162747"]             # Support Ops Centre
      # P2: Build SupportBricks as the TSE Delighter
      "12. Support Tooling Backend Service for SupportBricks": ["PLAT-152062"] # Support Tooling Service
      "13. Sherpa APIs for SupportBricks": ["SUPPORTDS"]                       # tracked in SUPPORTDS, not PLAT
      "14. SupportBricks as the TSE Work Surface": ["PLAT-157199"]            # SupportBricks

    # The 13 Q2 workstream Epics (one per workstream; DRI = first listed in the Q2 doc).
    # Replaces the retired Support Agent program-Epic structure (PLAT-156358 + old sub-Epics).
    # New work should be filed under the appropriate workstream Epic below.
    workstream_epics:
      - key: "PLAT-156366"
        name: "Support Agent MCP Server"
        dri: "vikash.choudhary@databricks.com"
      - key: "PLAT-152062"
        name: "Support Tooling Service"
        dri: "jacob.plachta@databricks.com"
      - key: "PLAT-160151"
        name: "Skills Quality & Creation, pre-merge"
        dri: "abizer.adenwala@databricks.com"
      - key: "PLAT-160152"
        name: "Skills Quality post-merge + eval + SA perf/adoption"
        dri: "sayan.sanyal@databricks.com"
      - key: "PLAT-162745"
        name: "Infra-level checks, pre-merge"
        dri: "manoj.koushik@databricks.com"
      - key: "PLAT-162746"
        name: "Remote Data Access"
        dri: "huy.nguyen@databricks.com"
      - key: "PLAT-161917"
        name: "Remote Support Agent"
        dri: "huy.nguyen@databricks.com"
      - key: "PLAT-119961"
        name: "Merlin"
        dri: "scott.oseychik@databricks.com"
      - key: "PLAT-162744"
        name: "Support Agent Learn Mode"
        dri: "manoj.koushik@databricks.com"
      - key: "PLAT-160153"
        name: "Support Agent Workflows"
        dri: "manoj.koushik@databricks.com"
      - key: "PLAT-162747"
        name: "Support Ops Centre"
        dri: "max.ramsay@databricks.com"
      - key: "SUPPORTDS"
        name: "Sherpa APIs for SupportBricks (tracked in SUPPORTDS)"
        dri: "sayan.sanyal@databricks.com"
      - key: "PLAT-157199"
        name: "SupportBricks"
        dri: "max.ramsay@databricks.com"

    # Standing Epics outside the 13 workstreams (KEPT, not retired):
    #   PLAT-156358 Support Agent (generic) - home for generic Support Agent work that is NOT
    #     Workflow Mode, Learn Mode, or CI. Not a workstream; do not fold into the 13.
    #   PLAT-157449 Aha! Ideas (Kevin) - cross-cutting holding Epic for CXI-owned, non-product items.
    # Pending Batch B retirement (active + Done children already re-parented):
    #   PLAT-160155, PLAT-160150, PLAT-160154, PLAT-160149, PLAT-145096, PLAT-146971,
    #   PLAT-149983, PLAT-162527, plus legacy (Doc Generation, Diagnostics, BotFather family).

  # Slack Configuration
  slack:
    # Your team's Slack channels
    channels:
      - support-automation
      - support-agent-internal
      - eng-support-automation
      - allhands-support
    # Optional: Filter messages by emoji reactions
    # 👉 CUSTOMIZE which emojis indicate important updates
    reaction_filter:
      - heart-eng   # 🎉 Celebrations/launches
      - rocket      # 🚀 Shipped features
      - star        # ⭐ Important decisions
      - plus1        # 👀 Needs attention
    days_back: 14  # How many days to look back
    min_reactions: 2  # Minimum reactions to include message

# Output Configuration (shared across profiles)
output:
  format: google_doc  # Options: google_doc, email, markdown

  google_drive:
    # Shared folder for all CXI updates
    folder_id: "15N7jxMSBzLpqVb92TxxZbTneCQUm9-tD"
    # Per-profile template_id is in the profiles section above

  slack_notification:
    enabled: true
    # Per-profile channel is in the profiles section above
    message_template: "{profile_name} draft ready for review: {link}"

# Metrics Configuration
# 👉 CUSTOMIZE which metrics to track and display
metrics:
  # Delivery Metrics
  delivery:
    - name: "Sprint Points Completed"
      source: "jira"  # Where to get this metric
      jql_field: "Story Points"  # Custom field in JIRA
    - name: "Features Shipped"
      source: "jira"
      count_status: "Done"
    - name: "Bugs Closed"
      source: "jira"
      count_issuetype: "Bug"

  # Quality Metrics
  quality:
    - name: "P0 Incidents"
      source: "jira"
      count_priority: "Highest"
      count_issuetype: "Incident"
    - name: "API Uptime"
      source: "external"  # From monitoring dashboard
      dashboard_url: "https://grafana.example.com/dashboard"

  # Customer Metrics (if applicable)
  customer:
    - name: "Active Users"
      source: "dashboard"
      dashboard_url: "https://analytics.example.com"
    - name: "Support Tickets"
      source: "jira"
      project_key: "SUPPORT"

# Advanced Settings
advanced:
  # Automatically detect launches/milestones from JIRA
  auto_detect_launches:
    enabled: true
    # JIRA labels that indicate a launch
    launch_labels:
      - "GA"
      - "Private-Preview"
      - "Public-Preview"

  # Automatically detect blockers
  auto_detect_blockers:
    enabled: true
    # Issues with these labels/priorities are auto-flagged as blockers
    blocker_labels:
      - "blocker"
      - "escalation"
    blocker_priorities:
      - "Highest"

  # Content generation preferences
  content_generation:
    max_highlights: 4  # Maximum number of key highlights
    max_blockers: 3    # Maximum number of blockers to show
    include_metrics_trends: true  # Show ↑/↓ trends
    include_customer_quotes: false  # Pull from support tickets (experimental)

# Links Configuration
# 👉 UPDATE with your team's actual links
links:
  go_link: "go/cxi"  # Main team update link
  best_practices_page_id: "6209308108"   # Confluence: Support Agent Best Practices (space UN); refreshed by the weekly_support profile after each TSE update
  best_practices_page: "go/cxi, Page: Support Agent Best Practices"
  faq_link: "go/cxi"   # FAQ link
  dashboard_link: "https://dashboard.example.com/abac"  # Metrics dashboard
  roadmap_link: "https://databricks.atlassian.net/wiki/spaces/UN/embed/6081610365?atl_f=PAGETREE"      # Roadmap link
  feedback_email: "cxi-team@company.com"  # Team email for feedback

