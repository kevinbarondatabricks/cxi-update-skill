    schedule: biweekly
    audience: "VP Support, COO, SVP Eng"
    template_id: "1_Wqcl7rmWHME4vGkKiCLs-3BXIdYE7gH7wbxuzW27ys"
    markdown_template: "assets/templates/biweekly-template.md"
    style_section: "Executive Summary Writing Style Guidance"
    title_format: "CXI Executive Summary - {date}"
    slack_notification_channel: "#support-automation"
    reviewers:
      primary: kevin.baron@databricks.com
      secondary: samira.emmerson@databricks.com
      cc:
        - nilesh.bhide@databricks.com
        - manoj@databricks.com

  weekly_support:
    name: "Weekly TSE Update (CXI Team Updates email)"
    schedule: weekly          # sent each Friday
    day: Friday
    audience: "All Support Engineering (TSEs, Tech Leads, Shift Leads, TSE Managers, Directors; plus IM/EM and Field Eng)"
    output_format: email      # this profile sends an email draft, NOT a Google Doc
    email:
      subject: "CXI Team Updates"
      to:
        - support-internal@databricks.com
      cc:                                      # resolved via Glean 2026-05-29
        - hatim@databricks.com                  # Hatim Shafique
        - vinod.marur@databricks.com            # Vinod Marur
        - sam.shah@databricks.com               # Sam Shah
        - sayan.sanyal@databricks.com           # Sayan Sanyal
        - olarn.p@databricks.com                # Olarn Pornpitaksuk
        - devyn.fisher@databricks.com           # Devyn Fisher
        - farhad.pagdiwalla@databricks.com      # Farhad Pagdiwalla
        - nilesh.bhide@databricks.com           # Nilesh Bhide
        - ravi.gangumalla@databricks.com        # Ravi Gangumalla
        - jacob.plachta@databricks.com          # Jacob Plachta
        - huy.nguyen@databricks.com             # Huy Nguyen
        - ted.tomlinson@databricks.com          # Ted Tomlinson
        - akhil.aggrawal@databricks.com         # Akhil Aggrawal
        - nandini.r@databricks.com              # Nandini N
        - nidhin.vn@databricks.com              # Nidhin V N
    markdown_template: "assets/templates/tse-update-email-template.md"
    style_section: "Weekly Support Update Writing Style Guidance"
    title_format: "CXI Team Updates"
